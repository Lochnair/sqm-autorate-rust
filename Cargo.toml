[package]
name = "unravel"
version = "0.5.0-rc1"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[profile.dev]
codegen-units = 1
lto = true
opt-level = 's'

[profile.release]
codegen-units = 1
lto = true
opt-level = 'z'
panic = "abort"
strip = "symbols"


[dependencies]
anyhow = "1.0"
async-trait = "0.1.92"
config = { version = "0.15.27", default-features = false }
csv = "1.4.0"
fastrand = "2"
icmp-socket2 = { version = "0.6.4", features = ["tokio"] }
irtt-client = { version = "0.7.0", optional = true, features = ["ancillary", "tokio"] }
libc = "0.2"
rustix = { version = "1.1", features = ["fs", "system", "thread", "time"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2.0"
tokio = { version = "1", features = ["full"] }
uci-derive = { path = "crates/uci-derive" }

[dependencies.log]
features = ["std"]
version = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
netlink-bindings = { version = "0.3.5", features = ["rt-link", "tc"] }
netlink-socket2 = { version = "0.3.5" }

[target.'cfg(unix)'.dependencies]
ucifer = { version = "0.5.0-rc.2", optional = true }

[features]
default = ["irtt", "toml", "uci"]
irtt = ["dep:irtt-client"]
toml = ["config/toml"]
uci = ["dep:ucifer"]
# Compatibility alias for builds that previously selected vendored libuci.
uci-vendored = ["uci"]

[workspace]
members = ["crates/uci-derive"]
resolver = "3"
